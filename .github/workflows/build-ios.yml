name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XTOOL_VERSION: "1.17.0"
      XTOOL_SHA256: 7796364f6b568f3a728ec4afef1d6ccd4b12bdfbca1b33a92cbead65545ed2fe

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"

      - name: Install pinned xtool
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xtool.app.zip"
          url="https://github.com/xtool-org/xtool/releases/download/$XTOOL_VERSION/xtool.app.zip"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "$XTOOL_SHA256  $archive" | shasum --algorithm 256 --check
          ditto -x -k "$archive" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          test "$($RUNNER_TEMP/xtool.app/Contents/Resources/bin/xtool --version)" = "xtool $XTOOL_VERSION"

      - name: Test shared counter logic
        run: swift test

      - name: Generate Xcode workspace
        run: |
          set -euo pipefail
          xtool dev generate-xcode-project
          test -d xtool/AppbaseIOS.xcworkspace
          xcodebuild -workspace xtool/AppbaseIOS.xcworkspace -list

      - name: Build with Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace xtool/AppbaseIOS.xcworkspace \
            -scheme AppbaseIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Embed Xcode-generated App Intents metadata
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          generated_metadata="$products/AppbaseIOS.appintents/Metadata.appintents"
          embedded_metadata="$products/AppbaseIOS.app/Metadata.appintents"

          test -s "$generated_metadata/extract.actionsdata"
          ditto "$generated_metadata" "$embedded_metadata"
          test -s "$embedded_metadata/extract.actionsdata"

      - name: Verify, ad-hoc sign, and package IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AppbaseIOS.app"
          widget="$app/PlugIns/AppbaseIOSWidget.appex"
          metadata="$app/Metadata.appintents/extract.actionsdata"

          test -x "$app/AppbaseIOS"
          test -x "$widget/AppbaseIOSWidget"
          test -s "$metadata"
          file "$app/AppbaseIOS" | grep -q 'arm64'
          file "$widget/AppbaseIOSWidget" | grep -q 'arm64'

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "com.example.AppbaseIOS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget/Info.plist")" = "com.example.AppbaseIOS.Widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "0.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "1"

          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements AppbaseIOSWidget.entitlements "$widget"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements AppbaseIOS.entitlements "$app"
          codesign --verify --deep --strict "$app"
          codesign --display --entitlements :- "$app" 2>&1 \
            | grep -q 'group.com.example.AppbaseIOS.shared'
          codesign --display --entitlements :- "$widget" 2>&1 \
            | grep -q 'group.com.example.AppbaseIOS.shared'

          mkdir -p artifacts "$RUNNER_TEMP/AppbaseIOS-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/AppbaseIOS-ipa/Payload/AppbaseIOS.app"
          (
            cd "$RUNNER_TEMP/AppbaseIOS-ipa"
            ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/artifacts/AppbaseIOS.ipa"
          )
          unzip -t artifacts/AppbaseIOS.ipa
          shasum --algorithm 256 artifacts/AppbaseIOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AppbaseIOS-ad-hoc
          path: artifacts/AppbaseIOS.ipa
          if-no-files-found: error
          retention-days: 7
