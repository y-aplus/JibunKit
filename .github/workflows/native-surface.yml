name: Native package surface

on:
  workflow_dispatch:
    inputs:
      surface:
        required: true
        type: choice
        options: [spotlight-cold-start, p1-input-repair]
      simulator_runtime:
        default: ''
        type: string
  workflow_call:
    inputs:
      surface:
        required: true
        type: string
      simulator_runtime:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.surface }}
    strategy:
      fail-fast: false
      matrix:
        # One device-followup boundary; independent builds finish/report once.
        surface: ${{ fromJSON(inputs.surface == 'p1-input-repair' && '["incoming","intents"]' || format('["{0}"]', inputs.surface)) }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TUIST_VERSION: "4.207.0"
      TUIST_SHA256: 583fec75cc187bb84a30509ba5afe7455607547be0917fdcf5899a7ef338305e
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate surface
        env:
          SURFACE: ${{ matrix.surface }}
        shell: bash
        run: |
          case "$SURFACE" in intents|widgets|incoming|web-authentication|device-http|spotlight-cold-start) ;; *) exit 2 ;; esac

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"

      - name: Install pinned Tuist
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tuist.zip" \
            "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip"
          echo "$TUIST_SHA256  $RUNNER_TEMP/tuist.zip" | shasum --algorithm 256 --check
          mkdir -p "$RUNNER_TEMP/tuist"
          ditto -x -k "$RUNNER_TEMP/tuist.zip" "$RUNNER_TEMP/tuist"
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tuist/tuist" version

      - name: Prepare simulator tests
        env:
          REQUESTED_RUNTIME: ${{ inputs.simulator_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          sim_id="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))['devices']
          runtimes = [runtime for runtime in devices if 'iOS-26' in runtime]
          requested = os.environ.get('REQUESTED_RUNTIME', '')
          if requested:
              runtimes = [runtime for runtime in runtimes if runtime.endswith('iOS-' + requested.replace('.', '-'))]
          if not runtimes:
              raise SystemExit('Requested iOS simulator runtime is not installed')
          runtime = max(runtimes, key=lambda value: tuple(map(int, value.split('iOS-')[1].split('-'))))
          candidates = [d for d in devices[runtime]
                        if d['name'].startswith('iPhone') and d['isAvailable']]
          if not candidates:
              raise SystemExit('No available iOS 26 iPhone simulator')
          candidates.sort(key=lambda d: (d['name'] != 'iPhone 16e', d['name']))
          print(candidates[0]['udid'])
          PY
          )"
          echo "SIMULATOR_ID=$sim_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$sim_id"
          xcrun simctl bootstatus "$sim_id" -b

      - name: Verify selected native surface
        env:
          SURFACE: ${{ matrix.surface }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SURFACE" in
            spotlight-cold-start)
              python3 Tools/verify-spotlight-cold-start.py --simulator-id "$SIMULATOR_ID"
              ;;
            device-http)
              python3 Tools/verify-p1-device-http.py --simulator-id "$SIMULATOR_ID"
              ;;
            intents)
              python3 -m unittest discover -s Tools/tests -p test_app_intents_identities.py
              python3 Tools/verify-package-app-intents.py --simulator-id "$SIMULATOR_ID" \
                2>&1 | tee "$RUNNER_TEMP/package-app-intents.log"
              ;;
            widgets)
              python3 Tools/verify-package-widgets-native.py --simulator-id "$SIMULATOR_ID" \
                2>&1 | tee "$RUNNER_TEMP/package-widgets.log"
              ;;
            incoming)
              tuist generate --no-open
              xcodebuild test -workspace JibunKit.xcworkspace -scheme IncomingNativeTests \
                -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
                -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" \
                -resultBundlePath "$RUNNER_TEMP/IncomingNative.xcresult" \
                -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
                CODE_SIGN_STYLE=Manual 2>&1 | tee "$RUNNER_TEMP/incoming-native.log"
              ;;
            web-authentication)
              python3 Tools/verify-web-authentication-native.py --simulator-id "$SIMULATOR_ID" \
                2>&1 | tee "$RUNNER_TEMP/web-authentication-native.log"
              python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path('Tests/WebAuthenticationNative/UITests.swift').read_text()
          methods = re.findall(r'\bfunc\s+(test\w+)\s*\(', source)
          assert methods and len(methods) == len(set(methods)), 'Missing or duplicate native test methods'
          root = Path(os.environ['RUNNER_TEMP'])
          log = (root / 'web-authentication-native.log').read_text(errors='replace')
          for method in methods:
              pattern = rf"Test Case '-\[(?:[A-Za-z0-9_]+\.)?WebAuthenticationNativeUITests {re.escape(method)}\]' passed \("
              assert len(re.findall(pattern, log)) == 1, f'Expected one native pass for {method}'
          (root / 'WebAuthentication-tests.json').write_text(json.dumps({'passed': methods}, indent=2) + '\n')
          PY
              ;;
          esac

      - name: Export Spotlight service diagnostics
        if: always() && matrix.surface == 'spotlight-cold-start'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/SpotlightColdStart"
          xcrun simctl spawn "$SIMULATOR_ID" log show --style compact --last 20m \
            --predicate 'subsystem CONTAINS[c] "spotlight" OR process CONTAINS[c] "spotlight" OR eventMessage CONTAINS "IndexAgent"' \
            > "$RUNNER_TEMP/SpotlightColdStart/simulator-service.log" 2>&1

      - name: Export native web screenshots and accessibility evidence
        if: always() && matrix.surface == 'web-authentication'
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/WebAuthentication.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/WebAuthentication.xcresult" \
              --output-path "$RUNNER_TEMP/WebAuthentication-attachments"
          fi

      - name: Upload surface diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Native-${{ matrix.surface }}-diagnostics
          path: |
            ${{ runner.temp }}/SpotlightColdStart
            ${{ runner.temp }}/P1DeviceHTTP
            ${{ runner.temp }}/package-app-intents.log
            ${{ runner.temp }}/PackageAppIntents
            ${{ runner.temp }}/package-widgets.log
            ${{ runner.temp }}/PackageWidgets
            ${{ runner.temp }}/IncomingNative.xcresult
            ${{ runner.temp }}/incoming-native.log
            ${{ runner.temp }}/web-authentication-native.log
            ${{ runner.temp }}/WebAuthentication.xcresult
            ${{ runner.temp }}/WebAuthentication-tests.json
            ${{ runner.temp }}/WebAuthentication-attachments
          if-no-files-found: warn
          retention-days: 14
