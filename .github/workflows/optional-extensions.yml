name: Build optional extensions

# Compile-only check for extension targets that are disabled by default
# (notification Service and Content). No IPA is produced or published.
# Pull requests run it only when the extension code or its build setup changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Sources/JibunKitNotificationService/**
      - Sources/JibunKitNotificationContent/**
      - Sources/JibunKitCore/MiniAppNotificationExtensions.swift
      - Tuist/ProjectDescriptionHelpers/**
      - Project.swift
      - .github/workflows/optional-extensions.yml

permissions:
  contents: read

jobs:
  build:
    name: Xcode 26.6 (notification extensions enabled)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TUIST_VERSION: "4.207.0"
      TUIST_SHA256: 583fec75cc187bb84a30509ba5afe7455607547be0917fdcf5899a7ef338305e
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"

      - name: Install pinned Tuist
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tuist.zip" \
            "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip"
          echo "$TUIST_SHA256  $RUNNER_TEMP/tuist.zip" | shasum --algorithm 256 --check
          mkdir -p "$RUNNER_TEMP/tuist"
          ditto -x -k "$RUNNER_TEMP/tuist.zip" "$RUNNER_TEMP/tuist"
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"

      - name: Enable notification extensions in this checkout only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          from pathlib import Path
          path = Path("Tuist/ProjectDescriptionHelpers/EnabledFeatureBuildRequirements.swift")
          text = path.read_text()
          replacements = {
              "public static let notificationService: FeatureBuildConfiguration? = nil":
                  "public static let notificationService: FeatureBuildConfiguration? = FeatureBuildConfiguration()",
              "public static let notificationContent: (build: FeatureBuildConfiguration, categories: [String])? = nil":
                  'public static let notificationContent: (build: FeatureBuildConfiguration, categories: [String])? = (FeatureBuildConfiguration(), ["jibunkit.probe.category.eA=="])',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one declaration: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          EOF

      - name: Generate and build
        shell: bash
        run: |
          set -euo pipefail
          tuist generate --no-open
          xcodebuild build \
            -workspace JibunKit.xcworkspace \
            -scheme JibunKit-App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify embedded extensions
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JibunKit_App.app"
          for name in JibunKitNotificationService_Extension JibunKitNotificationContent_Extension; do
            test -d "$app/PlugIns/$name.appex" || { echo "Missing $name.appex" >&2; ls "$app/PlugIns" >&2; exit 1; }
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
            "$app/PlugIns/JibunKitNotificationService_Extension.appex/Info.plist")" = com.apple.usernotifications.service
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:UNNotificationExtensionCategory:0' \
            "$app/PlugIns/JibunKitNotificationContent_Extension.appex/Info.plist")" = jibunkit.probe.category.eA==
