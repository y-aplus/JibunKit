name: Shortcut signing probe

# Temporary: checks whether `shortcuts sign` works on a GitHub-hosted Mac with
# no Apple Account signed in. A tiny shortcut is signed in both modes and
# uploaded for an import test on a device. Replaced by the real shortcut build
# or removed after the probe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Write and sign a test shortcut
        shell: bash
        run: |
          set -uo pipefail
          sw_vers
          command -v shortcuts || { echo "no shortcuts command"; exit 1; }
          mkdir -p out
          cat > out/probe.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>WFWorkflowActions</key>
            <array>
              <dict>
                <key>WFWorkflowActionIdentifier</key>
                <string>is.workflow.actions.showresult</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>Text</key>
                  <string>JibunKit shortcut signing probe</string>
                </dict>
              </dict>
            </array>
            <key>WFWorkflowClientVersion</key>
            <string>2607.0.2</string>
            <key>WFWorkflowMinimumClientVersion</key>
            <integer>900</integer>
            <key>WFWorkflowMinimumClientVersionString</key>
            <string>900</string>
            <key>WFWorkflowIcon</key>
            <dict>
              <key>WFWorkflowIconStartColor</key>
              <integer>4282601983</integer>
              <key>WFWorkflowIconGlyphNumber</key>
              <integer>59511</integer>
            </dict>
            <key>WFWorkflowImportQuestions</key>
            <array/>
            <key>WFWorkflowInputContentItemClasses</key>
            <array/>
            <key>WFWorkflowTypes</key>
            <array/>
          </dict>
          </plist>
          EOF
          plutil -lint out/probe.plist
          plutil -convert binary1 -o out/probe-unsigned.shortcut out/probe.plist
          status=0
          for mode in anyone people-who-know-me; do
            echo "::group::sign --mode $mode"
            start=$(date +%s)
            # `shortcuts sign` may wait for an account; the job timeout bounds it.
            shortcuts sign --mode "$mode" --input out/probe-unsigned.shortcut --output "out/probe-$mode.shortcut" 2>&1
            code=$?
            echo "exit=$code seconds=$(( $(date +%s) - start ))"
            if [[ -s "out/probe-$mode.shortcut" ]]; then
              ls -l "out/probe-$mode.shortcut"
              head -c 4 "out/probe-$mode.shortcut" | xxd
            else
              status=1
            fi
            echo "::endgroup::"
            echo "- \`$mode\`: exit $code, output $( [[ -s out/probe-$mode.shortcut ]] && echo present || echo missing )" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Upload signed shortcuts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shortcut-probe
          path: out/
          if-no-files-found: warn
          retention-days: 3
